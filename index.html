</style><style id="threshold-style">.threshold{padding:12px 0 6px}.threshold-head{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}.threshold-head strong{color:var(--accent);font-size:21px;font-variant-numeric:tabular-nums}.threshold input[type=range]{width:100%;height:30px;accent-color:var(--accent);touch-action:pan-y}.threshold-foot{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;gap:8px}.threshold-foot label{display:flex;align-items:center;gap:5px}.threshold-foot input{width:66px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);text-align:center}.base-check{display:flex;align-items:center;gap:10px;margin:14px 0 7px;padding:10px;background:var(--soft);border-radius:8px;font-size:14px}.base-check input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}</style></head><body><header><div class="wrap"><div><div class="logo">人物帖。</div><div class="small">PRIVATE INVESTIGATOR ARCHIVE</div></div><button class="btn" onclick="newCharacter()">＋ 探索者</button></div></header><main class="wrap" id="app"></main><div id="summonIntegration" class="hidden" style="position:fixed;inset:0;z-index:200;background:#07070b"><iframe id="summonFrame" title="探索者召喚" style="border:0;width:100%;height:100%;display:block"></iframe></div><nav id="nav"><button onclick="route('list')">一覧</button><button onclick="route('search')">技能検索</button><button onclick="editId=null;route('edit')">追加・編集</button><button onclick="route('settings')">保存・設定</button></nav><input type="file" id="importFile" accept=".json,application/json" hidden><script>
const SEED=null; // 個人データ・立ち絵は同梱しない
const KEY='jinbutsucho_stable_v1_characters';
let conditions=[{skill:'目星',min:70,aboveBase:false}],conditionMode='and',jobFilter='',tagFilter='',advancedSort='skill-desc';
let skillPrefs={favorites:['目星','聞き耳','図書館'],order:[]};
try{const saved=JSON.parse(localStorage.getItem('jinbutsucho_stable_v1_skill_prefs')||'null');if(saved&&Array.isArray(saved.favorites)&&Array.isArray(saved.order))skillPrefs=saved}catch(e){}
function saveSkillPrefs(){try{localStorage.setItem('jinbutsucho_stable_v1_skill_prefs',JSON.stringify(skillPrefs))}catch(e){alert('技能の表示設定を保存できませんでした')}}
function orderedSkillNames(){const names=allSkillNames();return names.sort((a,b)=>{const fa=skillPrefs.favorites.includes(a)?0:1,fb=skillPrefs.favorites.includes(b)?0:1;if(fa!==fb)return fa-fb;const ia=skillPrefs.order.indexOf(a),ib=skillPrefs.order.indexOf(b);return (ia<0?99999:ia)-(ib<0?99999:ib)||a.localeCompare(b,'ja')})}
let skillPickerIndex=null,skillPickerQuery='';
const CATEGORY_KEY='jinbutsucho_stable_v1_category_overrides';
const SKILL_CATS=['戦闘技能','探索技能','行動技能','交渉技能','知識技能','その他'];
let categoryOverrides={};
try {categoryOverrides=JSON.parse(localStorage.getItem(CATEGORY_KEY)||'{}')||{}}catch(e){categoryOverrides={}}
function saveCategoryOverrides(){try{localStorage.setItem(CATEGORY_KEY,JSON.stringify(categoryOverrides));return true}catch(e){alert('区分設定を保存できませんでした');return false}}
function setSkillCategory(name,value){
 if(value==='auto')delete categoryOverrides[name];else categoryOverrides[name]=value;
 if(saveCategoryOverrides())categorySettingsPage();
}
function categorySettingsPage(){
 const names=allSkillNames();
 app.innerHTML=`<button class="btn" onclick="route('settings')">← 設定へ</button><h1>技能区分の編集</h1><p class="small">通常はCoC6版の基本区分で表示します。変更した技能だけ、ここで指定した区分を優先します。探索者の技能値は変わりません。</p><div class="panel"><label class="field"><span>技能名で絞り込み</span><input id="categoryFilter" placeholder="例：芸術" autocomplete="off"></label><div id="categoryRows"></div></div>`;
 const input=document.getElementById('categoryFilter');
 input.addEventListener('input',()=>drawCategoryRows(input.value));
 drawCategoryRows('');
}
function drawCategoryRows(query){
 const names=allSkillNames().filter(n=>n.toLocaleLowerCase().includes(query.toLocaleLowerCase()));
 document.getElementById('categoryRows').innerHTML=names.map(name=>`<div style="padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:100px">${esc(name)}</span><select style="width:auto;max-width:180px" data-skill="${esc(name)}"><option value="auto">基本区分に戻す</option>${SKILL_CATS.map(c=>`<option value="${esc(c)}" ${categoryOverrides[name]===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`).join('')||'<p class="muted">該当する技能がありません</p>';
 document.querySelectorAll('#categoryRows select').forEach(el=>el.addEventListener('change',()=>{const name=el.dataset.skill;if(el.value==='auto')delete categoryOverrides[name];else categoryOverrides[name]=el.value;saveCategoryOverrides()}));
}
let showInitialSkills=false; // 個別ページで初期値の技能も表示するか
let hideLost=false;
const LOST_TYPES={active:'現役',physical:'肉体ロスト',mental:'精神ロスト',insanity:'永久発狂',unspecified:'ロスト（種別未設定）'};
function lostType(c){const t=c?.lostType;return Object.prototype.hasOwnProperty.call(LOST_TYPES,t)?t:(c?.lost?'unspecified':'active')}
function isLost(c){return lostType(c)!=='active'}
function lostLabel(c){return LOST_TYPES[lostType(c)]+(c.noReturn?' / 復帰不可':'')}
function lostBadge(c){return isLost(c)?`<span class="lost-ribbon">${esc(lostLabel(c))}</span>`:(c.noReturn?'<span class="lost-ribbon">復帰不可</span>':'')}
function updateLostControls(){const type=document.querySelector('[name="lostType"]')?.value;const box=document.getElementById('noReturnOption');if(box)box.style.opacity=type==='active'?'0.65':'1'}
let galleryIndex=0,pendingGallery=[],viewGalleryIndex=0;
let chars=[],view='list',selected=null,tab='profile',searchSkill='目星',minValue=0,onlyLearned=false,sortOrder='desc',editId=null;
const LIST_PREF_KEY='jinbutsucho_list_preferences_v1';
let listPrefs={activeFirst:true,sort:'name',desc:false};
try{const stored=JSON.parse(localStorage.getItem(LIST_PREF_KEY)||'null');if(stored&&typeof stored==='object')listPrefs={...listPrefs,...stored}}catch(e){}
const LIST_SORT_KEYS=['name','STR','CON','POW','DEX','APP','SIZ','INT','EDU'];
if(!LIST_SORT_KEYS.includes(listPrefs.sort))listPrefs.sort='name';
if(typeof listPrefs.activeFirst!=='boolean')listPrefs.activeFirst=true;
if(typeof listPrefs.desc!=='boolean')listPrefs.desc=listPrefs.sort!=='name';
function setListPref(key,value){
 if(key==='sort'){
   if(!LIST_SORT_KEYS.includes(value))return;
   listPrefs.sort=value;
   listPrefs.desc=value!=='name'; // 名前はあいうえお順、能力値は高い順
 }else if(key==='activeFirst'||key==='desc'){
   listPrefs[key]=!!value;
 }else return;
 try{localStorage.setItem(LIST_PREF_KEY,JSON.stringify(listPrefs))}catch(e){}
 if(key==='sort')listPage();else filterCards();
}
function listValue(c,key){if(key==='name')return String(c.reading||c.name||'').trim();if(key==='job')return String(c.job||'');if(['アイデア','幸運','知識'].includes(key)){const stat={アイデア:'INT',幸運:'POW',知識:'EDU'}[key];const n=Number(c.stats?.[stat]);return c.stats?.[stat]==null||c.stats?.[stat]===''?null:n*5}if(key==='HP')return c.hp===''||c.hp==null?null:Number(c.hp);if(key==='MP')return c.mp===''||c.mp==null?null:Number(c.mp);if(key==='SAN')return c.san===''||c.san==null?null:Number(c.san);return c.stats?.[key]===''||c.stats?.[key]==null||!Number.isFinite(Number(c.stats[key]))?null:Number(c.stats[key])}
function sortList(arr){const key=listPrefs.sort,dir=listPrefs.desc?-1:1;return arr.sort((a,b)=>{if(listPrefs.activeFirst&&!!a.inUse!==!!b.inUse)return a.inUse?-1:1;const va=listValue(a,key),vb=listValue(b,key);if(va==null&&vb!=null)return 1;if(vb==null&&va!=null)return -1;let diff=typeof va==='number'&&typeof vb==='number'?va-vb:String(va??'').localeCompare(String(vb??''),'ja',{numeric:true});return dir*diff||String(a.reading||a.name||'').localeCompare(String(b.reading||b.name||''),'ja')})}
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const s=localStorage.getItem(KEY);if(s){const data=JSON.parse(s);if(Array.isArray(data)){chars=data;return}}}catch(e){alert('保存データを読み込めませんでした。空の状態で起動します。')}chars=[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(chars));return true}catch(e){alert('保存できませんでした。画像容量やブラウザの保存制限をご確認ください。JSONバックアップも利用できます。');return false}}
function route(v){view=v;render();window.scrollTo(0,0)}
function setProfileInUse(value,input){const c=chars.find(x=>x.id===selected);if(!c)return;const old=c.inUse;c.inUse=value;if(!save()){c.inUse=old;input.checked=!!old;return;}detailPage()}
function openChar(id){selected=id;tab='profile';showInitialSkills=false;viewGalleryIndex=0;route('detail')}
// A fresh iframe for each session prevents the editor/test lifecycle from
// leaving a stale frame or touch layer above the archive's buttons.
let summonSession=0;
function openSummon(mode="play"){
 const c=chars.find(x=>x.id===selected);
 if(!c){alert('探索者が見つかりません');return}
 const overlay=document.getElementById('summonIntegration');
 const previous=document.getElementById('summonFrame');
 if(previous)previous.remove();
 const frame=document.createElement('iframe');
 frame.id='summonFrame';
 frame.title='探索者召喚';
 frame.style.cssText='border:0;width:100%;height:100%;display:block';
 overlay.insertBefore(frame,overlay.firstChild);
 const imgs=galleryOf(c);
 const idx=imgs.length?((viewGalleryIndex%imgs.length)+imgs.length)%imgs.length:0;
 summonSession++;
 overlay.classList.remove('hidden');
 document.body.style.overflow='hidden';
 frame.src='./summon.html?id='+encodeURIComponent(c.id)+'&portrait='+idx+'&mode='+encodeURIComponent(mode)+'&session='+summonSession+'&build=fix2';
}
window.addEventListener('message',e=>{
 const frame=document.getElementById('summonFrame');
 if(e.source===frame?.contentWindow&&e.data?.type==='jinbutsucho-close-summon')closeSummon();
});
function closeSummon(){
 const overlay=document.getElementById('summonIntegration');
 // Hide synchronously, before tearing down the nested editor/ritual frames.
 overlay.classList.add('hidden');
 document.body.style.overflow='';
 const frame=document.getElementById('summonFrame');
 if(frame)frame.remove();
 // Rebuild the archive detail controls after leaving a test session.
 if(view==='detail')detailPage();
}

function summonLinkFor(id){const u=new URL('./index.html',location.href);u.search='';u.hash='';u.searchParams.set('summon',id);return u.href;}
async function copySummonLink(){const c=chars.find(x=>x.id===selected);if(!c)return;const link=summonLinkFor(c.id);try{await navigator.clipboard.writeText(link);alert('召喚URLをコピーしました。NFCタグへの書き込みやQRコード作成に利用できます。')}catch(e){prompt('この召喚URLをコピーしてください',link)}}
async function shareSummonLink(){const c=chars.find(x=>x.id===selected);if(!c)return;const link=summonLinkFor(c.id);if(navigator.share){try{await navigator.share({title:(c.name||'探索者')+'の召喚',url:link});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(link);alert('召喚URLをコピーしました')}catch(e){prompt('召喚URL',link)}}
function handleIncomingSummon(){const u=new URL(location.href),id=u.searchParams.get('summon');if(!id)return;u.searchParams.delete('summon');history.replaceState(null,'',u.pathname+u.search+u.hash);const c=chars.find(x=>x.id===id);if(!c){alert('この端末の人物帖に該当する探索者がいません。同じPWAに探索者を登録してください。');return}selected=c.id;tab='profile';viewGalleryIndex=0;view='detail';render();openSummon('play')}
function activeNav(){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['list','search','edit','settings'][i]===view||(view==='detail'&&i===0)))}
function render(){activeNav();if(view==='list')listPage();else if(view==='detail')detailPage();else if(view==='search')searchPage();else if(view==='edit')editPage();else settingsPage()}
function listPage(){const sorts=[['name','名前（あいうえお順）'],...['STR','CON','POW','DEX','APP','SIZ','INT','EDU'].map(x=>[x,x])];app.innerHTML=`<div class="small">STABLE CANDIDATE v1.6.3 / ${chars.length} RECORDS</div><h1>探索者たちの記録。</h1><label class="field"><span>名前・職業・タグで検索</span><input id="nameFilter" placeholder="名前や職業で検索" oninput="filterCards()"></label><label class="lost-toggle"><input type="checkbox" ${hideLost?'checked':''} onchange="setHideLost(this.checked)">ロストした探索者を非表示（復帰不可のみは対象外）</label><div class="panel"><label class="lost-toggle"><input type="checkbox" ${listPrefs.activeFirst?'checked':''} onchange="setListPref('activeFirst',this.checked)">現行使用中の探索者を優先表示</label><label class="field"><span>並び替え</span><select onchange="setListPref('sort',this.value)">${sorts.map(([k,label])=>`<option value="${k}" ${listPrefs.sort===k?'selected':''}>${label}</option>`).join('')}</select></label><label class="lost-toggle"><input type="checkbox" ${listPrefs.desc?'checked':''} onchange="setListPref('desc',this.checked)">逆順（名前：ん→あ／能力値：低い順）</label></div><div class="grid" id="cards"></div>`;filterCards()}
function setHideLost(value){hideLost=!!value;if(view==='list')filterCards();else if(view==='search')drawResults()}
function filterCards(){const q=(document.getElementById('nameFilter')?.value||'').toLowerCase();let filtered=chars.filter(c=>(!hideLost||!isLost(c))&&[c.name,c.reading,c.job,c.tag,...getTags(c)].join(' ').toLowerCase().includes(q));document.getElementById('cards').innerHTML=sortList(filtered).map(c=>`<button class="card ${isLost(c)?'lost-card':''}" onclick="openChar(${JSON.stringify(c.id).replace(/"/g,'&quot;')})">${c.image?`<img src="${esc(c.image)}" alt="">`:`<div style="height:220px;display:grid;place-items:center;background:#ebe6df;color:#8c8277">NO IMAGE</div>`}<div class="info">${lostBadge(c)}${c.inUse?'<span class="pill" style="background:#e3f2e5;color:#245c38">使用中</span>':''}<span class="pill">${esc(c.job||'未設定')}</span><strong>${esc(c.name||'無名の探索者')}</strong><div class="small">${esc(c.reading||'')} / ${esc(c.age||'?')}歳</div></div></button>`).join('')||'<div class="empty">該当する探索者はいません。</div>'}
function derivedRoll(value){if(value===null||value===undefined||value==='')return '—';const n=Number(value);return Number.isFinite(n)&&n>=0?String(n*5):'—'}
function galleryOf(c){
 const a=Array.isArray(c.images)?c.images.filter(x=>typeof x==='string'&&x.startsWith('data:image/')):[];
 return a.length?a:(c.image?[c.image]:[]);
}
function galleryHtml(c){
 const imgs=galleryOf(c);
 if(!imgs.length)return '<div class="hero"><div class="empty">立ち絵未登録</div></div>';
 const i=((viewGalleryIndex%imgs.length)+imgs.length)%imgs.length;
 return `<div class="gallery-stage"><img src="${esc(imgs[i])}" alt="${esc(c.name)}の立ち絵 ${i+1}">${imgs.length>1?`<button type="button" class="gallery-arrow prev" aria-label="前の立ち絵" onclick="slideGallery(-1)">‹</button><button type="button" class="gallery-arrow next" aria-label="次の立ち絵" onclick="slideGallery(1)">›</button>`:''}</div>${imgs.length>1?`<div class="gallery-counter">${i+1} / ${imgs.length}　左右の矢印で差分を切り替え</div>`:''}`;
}
function slideGallery(step){const c=chars.find(x=>x.id===selected);if(!c)return;const n=galleryOf(c).length;if(!n)return;viewGalleryIndex=(viewGalleryIndex+step+n)%n;detailPage()}
const MEMO_TYPES=['不定の狂気','アーティファクト','後遺症','その他'];
function memoTypeOptions(current){return [...new Set([...MEMO_TYPES,current].filter(Boolean))].map(t=>`<option value="${esc(t)}" ${current===t?'selected':''}>${esc(t)}</option>`).join('')}
function memoEditorRow(type='その他',body=''){
 return `<div class="memo-edit-row"><label class="field"><span>メモの種類</span><select class="memoType">${memoTypeOptions(type)}</select></label><label class="field"><span>内容</span><textarea class="memoBody" placeholder="内容を入力">${esc(body)}</textarea></label><button type="button" class="btn danger" onclick="this.closest('.memo-edit-row').remove()">このメモを削除</button></div>`;
}
function addMemoRow(){document.getElementById('memoEditor')?.insertAdjacentHTML('beforeend',memoEditorRow())}
function galleryEditorHtml(){
 return pendingGallery.map((img,i)=>`<div class="gallery-edit-row"><img src="${esc(img)}" alt="立ち絵 ${i+1}"><span style="flex:1">差分 ${i+1}${i===0?'（一覧用）':''}</span><button type="button" class="btn" onclick="moveGalleryImage(${i},-1)" ${i===0?'disabled':''}>↑</button><button type="button" class="btn" onclick="moveGalleryImage(${i},1)" ${i===pendingGallery.length-1?'disabled':''}>↓</button><button type="button" class="btn danger" onclick="removeGalleryImage(${i})">削除</button></div>`).join('')||'<p class="small">画像未登録</p>';
}
function drawGalleryEditor(){const el=document.getElementById('galleryEditor');if(el)el.innerHTML=galleryEditorHtml()}
function moveGalleryImage(i,dir){const j=i+dir;if(j<0||j>=pendingGallery.length)return;[pendingGallery[i],pendingGallery[j]]=[pendingGallery[j],pendingGallery[i]];drawGalleryEditor()}
function removeGalleryImage(i){pendingGallery.splice(i,1);drawGalleryEditor()}
async function addGalleryImages(event){
 const files=Array.from(event.target.files||[]);
 if(!files.length)return;
 const status=document.getElementById('galleryStatus');
 if(status)status.textContent='画像を読み込み中…';
 try{
  for(const f of files){
   if(!f.type.startsWith('image/'))throw Error('画像以外のファイルが含まれています');
   const data=await new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('ファイルを読み込めません'));r.readAsDataURL(f);
   });
   const converted=await new Promise((resolve,reject)=>{
    const img=new Image();img.onload=()=>{
     const scale=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));
     const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
     canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
     resolve(canvas.toDataURL('image/webp',.82));
    };img.onerror=()=>reject(Error('画像を開けません'));img.src=data;
   });
   pendingGallery.push(converted);
  }
  drawGalleryEditor();
  if(status)status.textContent=`${files.length}枚を追加しました。保存容量に注意してください。`;
 }catch(err){if(status)status.textContent='読み込みエラー: '+err.message}
 event.target.value='';
}

// 不定の狂気：元の能力値・技能値は書き換えず、表示用補正のみ算出する
const MADNESS_TYPES={
 dependence:{name:'依存',variants:['対象がある','対象がない'],description:'特定の物または行為への執着（人物指定不可）。',rules:'交渉4技能 -20。目星は対象あり -10、なし -15。'},
 exhaustion:{name:'神経衰弱',variants:['人がいる場所','精神分析を受けた相手と二人きり','条件に該当しない'],description:'精神的疲労に伴う身体の衰弱・消耗。',rules:'人がいる場所では全技能 -20。指定された相手と二人きりなら -10。'},
 phobia:{name:'恐怖症',variants:['恐怖対象がある','恐怖対象がない'],description:'特定の物・人物・行為への強い恐怖。',rules:'対象があるとき全技能 -10。身体を動かす技能は -20。'},
 obsession:{name:'狂愛',variants:['通常'],description:'特定の人物への激しい愛情と第三者への拒絶。',rules:'INT -2、対象以外との交渉技能 -20。'},
 eating:{name:'異常食症',variants:['過食','拒食','悪食'],description:'過食・拒食・悪食のいずれか。',rules:'探索技能 -10、アイデア -20。過食 POW -1／拒食 STR -1／悪食 CON -1。'},
 sleeping:{name:'睡眠障害',variants:['不眠','過眠'],description:'不眠または過眠による日常生活への影響。',rules:'不眠 CON -1、探索技能 -10、アイデア -20。過眠 POW -1、戦闘技能 -10、アイデア -20。'},
 illness:{name:'存在しない病',variants:['通常'],description:'存在しない病に侵されているという思い込み。',rules:'POW -1、EDU -1、知識系技能 -20。'},
 amnesia:{name:'健忘症',variants:['通常'],description:'過去の体験や出来事に関する記憶の欠落。',rules:'アイデア -30、知識 -30。'},
 hallucination:{name:'幻覚・幻聴',variants:['幻覚','幻聴','両方'],description:'日常的な幻覚・幻聴。',rules:'セッション開始時 SAN 1/1d3。幻覚は目星失敗時、幻聴は聞き耳失敗時 SAN 0/1（自動減算なし）。'},
 selfharm:{name:'自傷癖',variants:['首元','手・足','頭・胴'],description:'強い不安を覚えた際、自傷行為で安堵を得る。',rules:'SANC失敗時 HP -1。首元 交渉系 -20／手・足 行動系 -20／頭・胴 探索系 -20（HP自動減算なし）。'}
};
const MADNESS_CATEGORIES={
 '戦闘技能':['回避','キック','組み付き','こぶし','頭突き','投擲','マーシャルアーツ','拳銃','サブマシンガン','ショットガン','マシンガン','ライフル','杖','日本刀','刀','剣','ナイフ','槍','斧','弓','武道'],
 '探索技能':['応急手当','鍵開け','隠す','隠れる','聞き耳','忍び歩き','写真術','精神分析','追跡','登攀','図書館','目星'],
 '行動技能':['運転','機械修理','重機械操作','乗馬','水泳','製作','操縦','跳躍','電気修理','ナビゲート','変装'],
 '交渉技能':['言いくるめ','信用','説得','値切り','母国語','ほかの言語','他の言語','外国語'],
 '知識技能':['医学','オカルト','化学','クトゥルフ神話','芸術','経理','考古学','コンピューター','心理学','人類学','生物学','地質学','電子工学','天文学','博物学','物理学','法律','薬学','歴史']
};
function madnessCategory(name,skill){
 const custom=categoryOverrides[name]||skill?.category;
 if(custom){const c=String(custom);if(MADNESS_CATEGORIES[c])return c;if(MADNESS_CATEGORIES[c+'技能'])return c+'技能';}
 const n=String(name).replace(/[\s　]/g,'').replace(/[（(].*?[）)]/g,'');
 for(const [cat,names] of Object.entries(MADNESS_CATEGORIES)){if(names.some(x=>n===x||n.startsWith(x+'：')||n.startsWith(x+':')))return cat}
 return 'その他';
}
function madnessEntries(c){return Array.isArray(c.madness)?c.madness.filter(x=>x&&MADNESS_TYPES[x.type]):[]}
function madnessActive(c){return madnessEntries(c).filter(x=>x.status!=='cured'&&x.apply===true)}
function madnessModifiers(c){
 const result={stats:{},rolls:{},skills:{}},active=madnessActive(c);
 const stat=(k,n)=>result.stats[k]=(result.stats[k]||0)+n;
 const roll=(k,n)=>result.rolls[k]=(result.rolls[k]||0)+n;
 const skill=(k,n)=>result.skills[k]=(result.skills[k]||0)+n;
 const group=(cat,n,excluded=[])=>{for(const [k,v] of Object.entries(c.skills||{}))if(madnessCategory(k,v)===cat&&!excluded.includes(k))skill(k,n)};
 const all=(n)=>{for(const k of Object.keys(c.skills||{}))skill(k,n)};
 for(const m of active){
  const v=m.variant||'';
  switch(m.type){
   case 'dependence':for(const k of ['言いくるめ','説得','信用','値切り'])skill(k,-20);skill('目星',v==='対象がない'?-15:-10);break;
   case 'exhaustion':if(v==='人がいる場所')all(-20);if(v==='精神分析を受けた相手と二人きり')all(-10);break;
   case 'phobia':if(v==='恐怖対象がある'){all(-10);group('戦闘技能',-10);group('行動技能',-10)}break; // 身体を動かす技能の暫定判定
   case 'obsession':stat('INT',-2);if(m.conditionActive)group('交渉技能',-20);break;
   case 'eating':group('探索技能',-10);roll('アイデア',-20);stat(v==='拒食'?'STR':v==='悪食'?'CON':'POW',-1);break;
   case 'sleeping':stat(v==='過眠'?'POW':'CON',-1);group(v==='過眠'?'戦闘技能':'探索技能',-10);roll('アイデア',-20);break;
   case 'illness':stat('POW',-1);stat('EDU',-1);group('知識技能',-20);break;
   case 'amnesia':roll('アイデア',-30);roll('知識',-30);break;
   case 'selfharm':group(v==='首元'?'交渉技能':v==='手・足'?'行動技能':'探索技能',-20);break;
  }
 }
 return result;
}
function madnessStatDisplay(c,key){const n=c.stats?.[key],mod=madnessModifiers(c).stats[key]||0;if(n===''||n==null||!Number.isFinite(Number(n)))return '—';return `${Number(n)+mod}${mod?` <small class="madness-delta">(${mod})</small>`:''}`}
function madnessRollDisplay(c,label,key){const n=c.stats?.[key];if(n===''||n==null||!Number.isFinite(Number(n)))return '—';const mods=madnessModifiers(c);const statmod=mods.stats[key]||0,rollmod=mods.rolls[label]||0;const val=(Number(n)+statmod)*5+rollmod;return `${val}${statmod||rollmod?` <small class="madness-delta">(${statmod*5+rollmod})</small>`:''}`}
function madnessSkillDisplay(c,name,v){const raw=v?.value;if(raw===''||raw===null||raw===undefined)return '—';const n=Number(raw);if(!Number.isFinite(n))return esc(raw);const d=madnessModifiers(c).skills[name]||0;return `${n+d}${d?` <small class="madness-delta">(${d})</small>`:''}`}
function madnessTypeOptions(type){return Object.entries(MADNESS_TYPES).map(([id,r])=>`<option value="${id}" ${type===id?'selected':''}>${esc(r.name)}</option>`).join('')}
function madnessRow(m={type:'dependence',variant:'対象がある',status:'active',apply:false,conditionActive:false,target:'',duration:'',notes:''}){
 const r=MADNESS_TYPES[m.type]||MADNESS_TYPES.dependence;
 return `<div class="madness-edit-row memo-edit-row"><label class="field"><span>不定の種類</span><select class="mad-type" onchange="madnessTypeChanged(this)">${madnessTypeOptions(m.type)}</select></label><label class="field"><span>条件・症状</span><select class="mad-variant">${r.variants.map(v=>`<option value="${esc(v)}" ${m.variant===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label><label class="field"><span>対象・詳細</span><input class="mad-target" value="${esc(m.target||'')}" placeholder="依存対象・恐怖対象など"></label><label class="field"><span>発症期間</span><input class="mad-duration" value="${esc(m.duration||'')}" placeholder="例：残り2セッション"></label><label class="field"><span>状態</span><select class="mad-status"><option value="active" ${m.status!=='cured'?'selected':''}>継続中</option><option value="cured" ${m.status==='cured'?'selected':''}>治癒済み</option></select></label><label class="lost-toggle"><input class="mad-apply" type="checkbox" ${m.apply?'checked':''}>技能・判定値への補正を反映</label><label class="lost-toggle"><input class="mad-condition" type="checkbox" ${m.conditionActive?'checked':''}>狂愛：対象以外との交渉中（該当時のみON）</label><label class="field"><span>補足メモ</span><textarea class="mad-notes">${esc(m.notes||'')}</textarea></label><div class="notice mad-rules">${esc(r.rules)}</div><button type="button" class="btn danger" onclick="this.closest('.madness-edit-row').remove()">この不定を削除</button></div>`;
}
function madnessTypeChanged(sel){const row=sel.closest('.madness-edit-row'),r=MADNESS_TYPES[sel.value];row.querySelector('.mad-variant').innerHTML=r.variants.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');row.querySelector('.mad-rules').textContent=r.rules}
function addMadnessRow(){document.getElementById('madnessEditor')?.insertAdjacentHTML('beforeend',madnessRow())}
function readMadnessEditor(){return [...document.querySelectorAll('.madness-edit-row')].map(row=>({
 type:row.querySelector('.mad-type').value,variant:row.querySelector('.mad-variant').value,

}))}
function madnessRecordHtml(c){
 const entries=madnessEntries(c);
 if(!entries.length)return '<p class="muted">不定の狂気は未登録です。</p>';
 return entries.map(m=>{const r=MADNESS_TYPES[m.type];return `<div class="madness-record"><b>${esc(r.name)}</b> <span class="pill">${m.status==='cured'?'治癒済み':'継続中'}</span> <span class="pill">${m.apply&&m.status!=='cured'?'補正ON':'補正OFF'}</span><p>${esc(m.variant||'')} ${esc(m.target||'')}</p>${m.duration?`<p class="small">期間：${esc(m.duration)}</p>`:''}<p class="small">${esc(r.description)}</p><p class="notice">${esc(r.rules)}</p>${m.notes?`<p style="white-space:pre-wrap">${esc(m.notes)}</p>`:''}</div>`}).join('');
}

// 個別ページの技能はキャラシの区分に従ってグループ表示する。
// 未分類や独自技能も削除せず「その他」に表示する。
function renderGroupedCharacterSkills(skills,includeInitial=false,character=null){
 const allEntries=Object.entries(skills||{});
 if(!allEntries.length)return '<p class="muted">技能未登録</p>';
 // 初期値が記録されている場合だけ比較する。初期値不明の独自技能は隠さない。
 const entries=includeInitial?allEntries:allEntries.filter(([name,v])=>{
  const value=Number(v&&v.value),base=Number(v&&v.base);
  return v==null||v.base==null||v.base===''||!Number.isFinite(value)||!Number.isFinite(base)||value!==base;
 });
 if(!entries.length)return '<p class="muted">初期値を超える技能はありません。「初期値の技能も表示」にチェックを入れるとすべて確認できます。</p>';
 const standard=['戦闘技能','探索技能','行動技能','交渉技能','知識技能'];
 const normalize=cat=>{
  const t=String(cat||'').trim();
  if(!t)return 'その他';
  const found=standard.find(x=>t===x||t===x.replace('技能','')||t===x.replace('技能','系'));
  return found||t;
 };
 const skillGroups={
  '戦闘技能':['回避','キック','組み付き','こぶし','こぶし（パンチ）','頭突き','投擲','マーシャルアーツ','拳銃','サブマシンガン','ショットガン','マシンガン','ライフル','杖','日本刀','刀','剣','ナイフ','槍','斧','弓','武道'],
  '探索技能':['応急手当','鍵開け','隠す','隠れる','聞き耳','忍び歩き','写真術','精神分析','追跡','登攀','図書館','目星'],
  '行動技能':['運転','機械修理','重機械操作','乗馬','水泳','製作','操縦','跳躍','電気修理','ナビゲート','変装'],
  '交渉技能':['言いくるめ','信用','説得','値切り','母国語','ほかの言語','他の言語','外国語'],
  '知識技能':['医学','オカルト','化学','クトゥルフ神話','芸術','経理','考古学','コンピューター','心理学','人類学','生物学','地質学','電子工学','天文学','博物学','物理学','法律','薬学','歴史']
 };
 function inferCategory(name){
  const n=String(name).replace(/[\s　]/g,'').replace(/[（(].*?[）)]/g,'');
  for(const [cat,items] of Object.entries(skillGroups)){
   if(items.some(x=>n===x||n.startsWith(x+'：')||n.startsWith(x+':')))return cat;
  }
  return 'その他';
 }
 const groups=new Map();
 entries.forEach(([name,v])=>{
  const cat=normalize(v&&v.category)||'その他';
  const resolved=categoryOverrides[name]|| (cat==='その他'?inferCategory(name):cat);
  if(!groups.has(resolved))groups.set(resolved,[]);
  groups.get(resolved).push([name,v||{}]);
 });
 const cats=[...groups.keys()].sort((a,b)=>{
  const ia=standard.indexOf(a),ib=standard.indexOf(b);
  return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b,'ja');
 });
 return cats.map(cat=>`<section class="skill-category"><h3 class="skill-category-title">${esc(cat)} <span class="small">${groups.get(cat).length}件</span></h3>${groups.get(cat).sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([name,v])=>`<div class="skillrow"><div class="line"><span>${esc(name)}</span><b>${character?madnessSkillDisplay(character,name,v):esc(v.value??'—')}%</b></div><div class="bar"><div style="width:${Math.max(0,Math.min(100,+v.value||0))}%"></div></div></div>`).join('')}</section>`).join('');
}
function allSkillNames(){return [...new Set(chars.flatMap(c=>Object.keys(c.skills||{})))].sort((a,b)=>a.localeCompare(b,'ja'))}
function allJobTags(){return [...new Set(chars.flatMap(c=>getTags(c)))].sort((a,b)=>a.localeCompare(b,'ja'))}
function getTags(c){return Array.isArray(c.jobTags)?c.jobTags:(typeof c.jobTags==='string'?c.jobTags.split(/[,、\n]/).map(x=>x.trim()).filter(Boolean):[])}
function setCondition(i,key,val){conditions[i][key]=key==='min'?Math.max(0,Math.min(100,Number(val)||0)):key==='aboveBase'?Boolean(val):val;if(key==='min'){const out=document.getElementById('minLabel'+i);if(out)out.textContent=conditions[i].min+'%';const n=document.getElementById('minNumber'+i);if(n&&Number(n.value)!==conditions[i].min)n.value=conditions[i].min;const slider=document.getElementById('minSlider'+i);if(slider&&Number(slider.value)!==conditions[i].min)slider.value=conditions[i].min;}drawResults()}
function addCondition(){conditions.push({skill:orderedSkillNames()[0]||'目星',min:50,aboveBase:false});searchPage()}
function removeCondition(i){if(conditions.length===1)return;conditions.splice(i,1);searchPage()}
function searchPage(){let names=orderedSkillNames();conditions.forEach(c=>{if(!names.includes(c.skill))c.skill=names[0]||''});let jobs=[...new Set(chars.map(c=>c.job).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));let tags=allJobTags();app.innerHTML=`<div class="small">ADVANCED INVESTIGATOR SEARCH</div><h1>探索者・詳細検索</h1><div class="panel"><h2>技能条件</h2><p class="small">「＋条件を追加」でいくつでも増やせます。</p><div id="conditions">${conditions.map((c,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="small">条件 ${i+1}</div><div class="two"><label class="field"><span>技能</span><button type="button" class="btn" style="width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center" onclick="openSkillPicker(${i})"><span>${esc(c.skill||'技能を選択')}</span><span>⌕ ▾</span></button></label></div><div class="threshold"><div class="threshold-head"><label for="minSlider${i}">最低技能値</label><strong id="minLabel${i}">${c.min}%</strong></div><input id="minSlider${i}" aria-label="最低技能値スライダー" type="range" min="0" max="100" step="1" value="${c.min}" oninput="setCondition(${i},'min',this.value)"><div class="threshold-foot"><span>0%</span><label>数値入力 <input id="minNumber${i}" aria-label="最低技能値を数値入力" type="number" min="0" max="100" value="${c.min}" oninput="setCondition(${i},'min',this.value)"></label><span>100%</span></div><label class="base-check"><input type="checkbox" ${c.aboveBase?'checked':''} onchange="setCondition(${i},'aboveBase',this.checked)"><span>初期値より高い探索者のみ</span></label><div class="small">チェック時は、設定した最低値に加えて、その技能の初期値（キャラシの base）を超える探索者を検索します。</div></div>${conditions.length>1?`<button class="btn danger" onclick="removeCondition(${i})">この条件を削除</button>`:''}</div>`).join('')}</div><button class="btn" style="margin-top:12px" onclick="addCondition()">＋ 条件を追加</button><label class="field"><span>条件の組み合わせ</span><select onchange="conditionMode=this.value;drawResults()"><option value="and" ${conditionMode==='and'?'selected':''}>AND：すべて満たす</option><option value="or" ${conditionMode==='or'?'selected':''}>OR：どれかを満たす</option></select></label></div><div class="panel"><h2>職業・タグ</h2><label class="field"><span>職業で絞り込む</span><select onchange="jobFilter=this.value;drawResults()"><option value="">すべての職業</option>${jobs.map(j=>`<option value="${esc(j)}" ${jobFilter===j?'selected':''}>${esc(j)}</option>`).join('')}</select></label><label class="field"><span>職業タグで絞り込む</span><select onchange="tagFilter=this.value;drawResults()"><option value="">すべてのタグ</option>${tags.map(t=>`<option value="${esc(t)}" ${tagFilter===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label><p class="small">タグは探索者の編集画面で自由に追加できます（例：警察関係、医療関係、公務員）。</p><label class="field"><span>並び順</span><select onchange="advancedSort=this.value;drawResults()"><option value="skill-desc" ${advancedSort==='skill-desc'?'selected':''}>条件1の技能が高い順</option><option value="skill-asc" ${advancedSort==='skill-asc'?'selected':''}>条件1の技能が低い順</option><option value="job" ${advancedSort==='job'?'selected':''}>職業順</option><option value="name" ${advancedSort==='name'?'selected':''}>名前順</option></select></label></div><label class="lost-toggle"><input type="checkbox" ${hideLost?'checked':''} onchange="setHideLost(this.checked)">ロストした探索者を検索結果から除外</label><div id="results"></div><div id="skillPickerHost"></div>`;drawResults()}

function moveSkill(name,direction){const names=orderedSkillNames();const group=names.filter(n=>skillPrefs.favorites.includes(n)===skillPrefs.favorites.includes(name));let i=group.indexOf(name),j=i+direction;if(j<0||j>=group.length)return;[group[i],group[j]]=[group[j],group[i]];const other=names.filter(n=>skillPrefs.favorites.includes(n)!==skillPrefs.favorites.includes(name));skillPrefs.order=skillPrefs.favorites.includes(name)?[...group,...other]:[...other,...group];saveSkillPrefs();renderSkillPicker()}

function renderSkillPicker(keepFocus=false){const host=document.getElementById('skillPickerHost');if(!host||skillPickerIndex===null)return;const all=orderedSkillNames();const filtered=all.filter(n=>n.toLocaleLowerCase('ja').includes(skillPickerQuery.toLocaleLowerCase('ja')));host.innerHTML=`<div class="skill-overlay" onclick="if(event.target===this)closeSkillPicker()"><div class="skill-dialog" role="dialog" aria-modal="true" aria-label="技能を選ぶ"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 style="margin:0">技能を選ぶ</h2><button class="btn" onclick="closeSkillPicker()">閉じる ×</button></div><p class="small">★ お気に入りは先頭へ。↑↓で表示順を変更できます。</p><input id="skillPickerSearch" class="skill-query" placeholder="技能名を入力して検索（例：心理）" value="${esc(skillPickerQuery)}" oninput="setSkillPickerQuery(this.value)"><div id="skillPickerList" class="skill-picker-list">${skillPickerRows(filtered)}</div><p class="small">表示順はこのブラウザに保存されます。検索結果や技能値は変更されません。</p></div></div>`;if(keepFocus){const input=document.getElementById('skillPickerSearch');input?.focus();input?.setSelectionRange(input.value.length,input.value.length)}}

function drawResults(){let arr=chars.filter(c=>{if(hideLost&&isLost(c))return false;if(jobFilter&&c.job!==jobFilter)return false;if(tagFilter&&!getTags(c).includes(tagFilter))return false;let checks=conditions.map(k=>{const data=c.skills?.[k.skill];if(!data)return false;const val=Number(data.value);if(!Number.isFinite(val)||val<k.min)return false;if(k.aboveBase){const base=Number(data.base);return Number.isFinite(base)&&val>base;}return true;});return conditionMode==='and'?checks.every(Boolean):checks.some(Boolean)});let first=conditions[0]?.skill;arr.sort((a,b)=>advancedSort==='name'?a.name.localeCompare(b.name,'ja'):advancedSort==='job'?(a.job||'').localeCompare(b.job||'','ja')||a.name.localeCompare(b.name,'ja'):(advancedSort==='skill-asc'?1:-1)*((Number(a.skills?.[first]?.value)||0)-(Number(b.skills?.[first]?.value)||0)));document.getElementById('results').innerHTML=`<div class="small">検索結果 ${arr.length} / ${chars.length} 人</div><div class="panel">${arr.map((c,i)=>`<div class="rank" onclick="openChar(${JSON.stringify(c.id).replace(/"/g,'&quot;')})"><div class="num">${i+1}</div><div class="who"><b>${esc(c.name)}</b> ${isLost(c)?'<span class="lost-ribbon">LOST</span>':''}<div class="small">${esc(c.job||'職業未設定')}　${getTags(c).map(t=>`<span class="pill">${esc(t)}</span>`).join(' ')}</div><div class="small">${conditions.map(k=>`${esc(k.skill)} ${esc(c.skills?.[k.skill]?.value??'—')}%${k.aboveBase?'（初期値超過）':''}`).join(' / ')}</div></div></div>`).join('')||'<div class="empty">条件に一致する探索者はいません。</div>'}</div>`}

{esc(c.name)}"></label><label class="field"><span>読み</span><input name="reading" value="${esc(c.reading)}"></label><label class="field"><span>職業</span><input name="job" value="${esc(c.job)}"></label><label class="field"><span>年齢</span><input name="age" value="${esc(c.age)}"></label><label class="field"><span>身長（cm）</span><input name="height" value="${esc(c.height)}"></label><label class="field"><span>作品・シナリオタグ</span><input name="tag" value="${esc(c.tag)}"></label></div><label class="field"><span>職業タグ（カンマ区切りで複数登録）</span><input name="jobTags" placeholder="例：警察関係, 公務員, 捜査職" value="${esc(getTags(c).join(', '))}"></label><p class="small">職業名は「刑事」、職業タグは「警察関係」のように設定できます。</p></div></details></div><div class="editor-section"><details class="editor-fold"><summary><span>立ち絵・画像</span><small>差分追加・順番変更</small></summary><div class="editor-fold-body"><h2>立ち絵差分</h2><p class="small">複数選択で差分を追加できます。先頭の画像が一覧にも表示されます。↑↓で並び替えできます。</p><input type="file" accept="image/*" multiple onchange="addGalleryImages(event)"><div id="galleryStatus" class="small" aria-live="polite"></div><div id="galleryEditor"></div></div></details></div><div class="editor-section"><details class="editor-fold"><summary><span>人物紹介・経歴</span><small>プロフィール文と経歴</small></summary><div class="editor-fold-body"><label class="field"><span>人物紹介</span><textarea name="bio">${esc(c.bio)}</textarea></label><label class="field"><span>経歴・メモ</span><textarea name="story">${esc(c.story)}</textarea></label></div></details></div><div class="editor-section"><details class="editor-fold"><summary><span>不定の狂気</span><small>症状・期間・技能補正</small></summary><div class="editor-fold-body"><h2>不定の狂気（専用管理）</h2><p class="small">種類・条件・期間・治癒状態・補正ON/OFFを個別に管理します。元の技能値は変更しません。</p><div id="madnessEditor">${madnessEntries(c).map(m=>madnessRow(m)).join("")}</div><button type="button" class="btn" onclick="addMadnessRow()">＋ 不定の狂気を追加</button></div></details></div><div class="editor-section"><details class="editor-fold"><summary><span>記録・メモ</span><small>アーティファクト・後遺症・秘匿・シナリオ</small></summary><div class="editor-fold-body"><h2>追加メモ</h2><p class="small">アーティファクト・後遺症・その他を自由に登録できます。</p><div id="memoEditor">${(Array.isArray(c.extraMemos)?c.extraMemos:[]).map(m=>memoEditorRow(m.type,m.body)).join('')}</div><button type="button" class="btn" onclick="addMemoRow()">＋ メモ欄を追加</button><label class="field"><span>秘匿・ネタバレメモ</span><textarea name="spoiler">${esc(c.spoiler)}</textarea></label><label class="field"><span>通過シナリオ（1行に1つ）</span><textarea name="scenarios">${esc((c.scenarios||[]).join('\n'))}</textarea></label></div></details></div><div class="editor-section"><details class="editor-fold"><summary><span>能力値・技能</span><small>能力値・HP・MP・SAN・技能編集</small></summary><div class="editor-fold-body"><h2>能力値</h2><div class="stats">${['STR','CON','POW','DEX','APP','SIZ','INT','EDU'].map(k=>`<label class="field"><span>${k}</span><input type="number" name="stat_${k}" value="${esc(c.stats?.[k]??'')}"></label>`).join('')}</div><div class="two">${['hp','mp','san','sanMax'].map(k=>`<label class="field"><span>${k.toUpperCase()}</span><input type="number" name="${k}" value="${esc(c[k]??'')}"></label>`).join('')}</div><h2>技能</h2><div class="small">技能名 / 現在値 / 初期値</div><div id="skillEditor">${Object.entries(c.skills||{}).map(([k,v])=>skillInput(k,v.value,v.base)).join('')}</div><button type="button" class="btn" onclick="addSkill()">＋ 技能を追加</button></div></details></div><div class="editor-section"><details class="editor-fold"><summary><span>いあきゃら取り込み</span><small>TXTファイル・テキスト貼り付け</small></summary><div class="editor-fold-body"><h2>いあきゃらテキスト取り込み</h2><p class="small">6版テキスト出力を貼ると、能力値と技能を入力欄へ反映します。保存前に内容を確認してください。</p><label class="field"><span>スマホ内のテキストファイル（.txt）</span><input type="file" id="iacharaTxtFile" accept=".txt,text/plain" onchange="loadIacharaTxt(event)"></label><p class="small" id="iacharaFileStatus" aria-live="polite">ファイルを選ぶと下の入力欄に内容を読み込みます。確認後に「テキストから反映」を押してください。</p><textarea id="iacharaText" placeholder="いあきゃらテキスト 6版…"></textarea><button type="button" class="btn" onclick="parseIachara()">テキストから反映</button></div></details></div><div class="actions"><button class="btn" type="button" onclick="editId=null;route('edit')">← 編集対象一覧へ</button><button class="btn primary" type="submit">変更を保存する</button>${editId!=='__new__'?'<button class="btn danger" type="button" onclick="deleteCharacter()">この探索者を削除</button>':''}</div></form>`;pendingGallery=[...galleryOf(c)];drawGalleryEditor();updateLostControls()}
function skillInput(name='',value='',base=''){return `<div class="editSkill"><input class="skName" placeholder="技能名" value="${esc(name)}"><input class="skValue" type="number" min="0" max="999" placeholder="値" value="${esc(value)}"><input class="skBase" type="number" min="0" max="999" placeholder="初期" value="${esc(base)}"><button type="button" onclick="this.parentElement.remove()">×</button></div>`}
function addSkill(){document.getElementById('skillEditor').insertAdjacentHTML('beforeend',skillInput())}
function previewImage(e){let f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024&&!confirm('画像が3MBを超えています。保存できない可能性があります。続けますか？')){e.target.value='';return}let reader=new FileReader();reader.onload=()=>{window.pendingImage=reader.result;document.getElementById('imagePreview').textContent='画像を読み込みました（保存前）'};reader.readAsDataURL(f)}
function submitEdit(e){e.preventDefault();let f=e.target,form=new FormData(f);let old=chars.find(x=>x.id===editId);let c=old?structuredClone(old):{id:'c'+Date.now(),skills:{},stats:{}};for(let k of ['name','reading','job','age','height','tag','bio','story','spoiler'])c[k]=String(form.get(k)||'');c.lostType=String(form.get('lostType')||'active');c.noReturn=form.has('noReturn');c.inUse=form.has('inUse');c.lost=c.lostType!=='active';c.jobTags=String(form.get('jobTags')||'').split(/[,、\n]/).map(x=>x.trim()).filter(Boolean);c.scenarios=String(form.get('scenarios')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);for(let k of ['STR','CON','POW','DEX','APP','SIZ','INT','EDU']){let v=form.get('stat_'+k);c.stats[k]=v===''?'':Number(v)}for(let k of ['hp','mp','san','sanMax']){let v=form.get(k);c[k]=v===''?'':Number(v)}const priorSkills=c.skills||{};c.skills={};let rows=document.querySelectorAll('.editSkill');rows.forEach(r=>{let name=r.querySelector('.skName').value.trim();if(name){const v=r.querySelector('.skValue').value,b=r.querySelector('.skBase').value;c.skills[name]={...(priorSkills[name]&&typeof priorSkills[name]==='object'?priorSkills[name]:{}),value:v===''?0:Number(v),base:b===''?null:Number(b)}}});c.images=[...pendingGallery];c.image=c.images[0]||'';c.madness=readMadnessEditor();c.extraMemos=[...document.querySelectorAll('#memoEditor .memo-edit-row')].map(row=>({type:row.querySelector('.memoType').value,body:row.querySelector('.memoBody').value})).filter(m=>m.body.trim());let previous=structuredClone(chars);if(old)chars[chars.findIndex(x=>x.id===editId)]=c;else chars.push(c);if(!save()){chars=previous;return}selected=c.id;editId=c.id;openChar(c.id)}
function deleteCharacter(){if(!confirm('この探索者を削除しますか？ 削除前にバックアップをおすすめします。'))return;chars=chars.filter(x=>x.id!==editId);if(save()){editId=null;route('list')}}
async function loadIacharaTxt(event){
 const input=event.target, file=input.files&&input.files[0];
 if(!file)return;
 const status=document.getElementById('iacharaFileStatus');
 try{
  if(!/\.txt$/i.test(file.name)&&file.type!=='text/plain')throw Error('TXT形式のファイルを選んでください。');
  if(file.size>2*1024*1024)throw Error('2MB以下のテキストファイルを選んでください。');
  const bytes=await file.arrayBuffer();
  let content=new TextDecoder('utf-8',{fatal:true}).decode(bytes);
  if(!content.trim())throw Error('ファイルが空です。');
  const textarea=document.getElementById('iacharaText');
  if(!textarea)throw Error('入力画面が見つかりません。');
  if(textarea.value.trim()&&!confirm('入力欄のテキストを選択したファイルの内容で置き換えますか？'))return;
  textarea.value=content.replace(/^\uFEFF/,'');
  if(status)status.textContent='読み込み完了：'+file.name+'（内容を確認して「テキストから反映」を押してください）';
 }catch(err){if(status)status.textContent='読み込み失敗：'+err.message;alert('TXTファイルを読み込めませんでした：'+err.message)}
 finally{input.value=''}
}
function parseIachara(){let t=document.getElementById('iacharaText').value;if(!t.trim())return alert('テキストを貼り付けてください');let fields={name:/名前:\s*(.+)/,job:/職業:\s*(.+)/,age:/年齢:\s*([^\/\n]+)/,height:/身長:\s*([^\n]+)/};for(let [k,re] of Object.entries(fields)){let m=t.match(re);if(m){let el=document.querySelector(`[name="${k}"]`);if(el)el.value=m[1].trim()}}let stat=t.match(/【能力値】([\s\S]*?)(?:【技能値】|$)/);if(stat){for(let k of ['STR','CON','POW','DEX','APP','SIZ','INT','EDU','HP','MP']){let m=stat[1].match(new RegExp('^\\s*'+k+'\\s+(\\d+)','m'));let el=document.querySelector(`[name="${['HP','MP'].includes(k)?k.toLowerCase():'stat_'+k}"]`);if(m&&el)el.value=m[1]}}let san=t.match(/正気度\s+(\d+)\s*\/\s*(\d+)/);if(san){document.querySelector('[name=san]').value=san[1];document.querySelector('[name=sanMax]').value=san[2]}let section='';let count=0;let entries=[];for(let line of t.split(/\r?\n/)){let m=line.match(/『(戦闘技能|探索技能|行動技能|交渉技能|知識技能)』/);if(m){section=m[1];continue}if(!section)continue;let hit=line.match(/^\s*(.+?)\s{2,}(\d+)\s+(\d+)\s+\d+\s+\d+\s+\d+\s+\d+\s*$/);if(hit){entries.push(skillInput(hit[1].trim(),hit[2],hit[3]));count++}}if(count)document.getElementById('skillEditor').innerHTML=entries.join('');alert(`取り込みました（技能 ${count} 件）。内容を確認して「変更を保存する」を押してください。`)}
// 一括TXT取り込み：既存データを上書きせず、確認後に追加する。
let bulkCandidates=[];
function bulkImportPage(){
 app.innerHTML=`<button class="btn" onclick="route('edit')">← 追加・編集へ</button><div class="small">BULK IMPORT</div><h1>TXTから一括登録</h1><div class="panel"><p>いあきゃらのテキストファイルを複数選択してください。既存の探索者は変更しません。</p><input id="bulkTxtFiles" type="file" accept=".txt,text/plain" multiple onchange="readBulkTxt(event)" style="max-width:100%"><p class="small">1ファイル2MB以下・UTF-8形式。登録前に確認できます。</p></div><div id="bulkResults"></div>`;
 bulkCandidates=[];
}
function parseIacharaRecord(t){
 const read=re=>{let m=t.match(re);return m?m[1].trim():''};
 const name=read(/(?:^|\n)名前[：:]\s*([^\r\n]+)/);
 if(!name)throw Error('名前の項目が見つかりません');
 const c={name,reading:'',job:read(/(?:^|\n)職業[：:]\s*([^\r\n]+)/),age:read(/(?:^|\n)年齢[：:]\s*([^\/\r\n]+)/),height:read(/(?:^|\n)身長[：:]\s*([^\r\n]+)/),tag:'',bio:'',story:'',spoiler:'',image:'',jobTags:[],stats:{},skills:{},scenarios:[]};
 const stat=t.match(/【能力値】([\s\S]*?)(?:【技能値】|$)/);
 if(stat){for(const k of ['STR','CON','POW','DEX','APP','SIZ','INT','EDU','HP','MP']){const m=stat[1].match(new RegExp('^\\s*'+k+'\\s+(\\d+)','m'));if(m){if(k==='HP'||k==='MP')c[k.toLowerCase()]=Number(m[1]);else c.stats[k]=Number(m[1]);}}}
 const san=t.match(/正気度\s+(\d+)\s*\/\s*(\d+)/);if(san){c.san=Number(san[1]);c.sanMax=Number(san[2]);}
 let section='';for(const line of t.split(/\r?\n/)){
  const sectionMatch=line.match(/『(戦闘技能|探索技能|行動技能|交渉技能|知識技能)』/);if(sectionMatch){section=sectionMatch[1];continue;}
  if(!section)continue;
  const hit=line.match(/^\s*(.+?)\s{2,}(\d+)\s+(\d+)\s+\d+\s+\d+\s+\d+\s+\d+\s*$/);
  if(hit)c.skills[hit[1].trim()]={value:Number(hit[2]),base:Number(hit[3])};
 }
 if(!Object.keys(c.stats).length&&!Object.keys(c.skills).length)throw Error('能力値・技能値を解析できませんでした（形式を確認してください）');
 return c;
}
async function readBulkTxt(event){
 const files=Array.from(event.target.files||[]);bulkCandidates=[];
 const results=document.getElementById('bulkResults');if(!results)return;
 const lines=[];
 for(const file of files){try{
  if(!/\.txt$/i.test(file.name))throw Error('TXT形式ではありません');
  if(file.size>2*1024*1024)throw Error('2MBを超えています');
  const bytes=await file.arrayBuffer();const content=new TextDecoder('utf-8',{fatal:true}).decode(bytes).replace(/^\uFEFF/,'');
  const c=parseIacharaRecord(content);bulkCandidates.push(c);
  lines.push(`<div class="panel"><b>✓ ${esc(file.name)}</b><p>${esc(c.name)} / ${esc(c.job||'職業未設定')} / 技能 ${Object.keys(c.skills).length} 件</p></div>`);
 }catch(err){lines.push(`<div class="panel"><b>✕ ${esc(file.name)}</b><p class="small">${esc(err.message)}</p></div>`);}}
 results.innerHTML=`<h2>読み込み結果：${bulkCandidates.length} / ${files.length} 件</h2>${lines.join('')}${bulkCandidates.length?'<button class="btn primary" onclick="commitBulkTxt()">確認した探索者をまとめて登録</button>':''}`;
 event.target.value='';
}
function commitBulkTxt(){
 if(!bulkCandidates.length)return;
 if(!confirm(`${bulkCandidates.length}人の探索者を新規追加します。よろしいですか？`))return;
 const previous=chars.slice();
 const used=new Set(chars.map(c=>c.id));
 for(const c of bulkCandidates){let id;do{id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}while(used.has(id));used.add(id);chars.push({...c,id});}
 if(!save()){chars=previous;return;}
 const count=bulkCandidates.length;bulkCandidates=[];alert(`${count}人の探索者を登録しました。`);route('list');
}
function settingsPage(){app.innerHTML=`<div class="small">LOCAL DATA MANAGEMENT</div><h1>保存とバックアップ</h1><div class="panel"><h2>この端末のデータ</h2><p>登録済み探索者：<b>${chars.length} 人</b></p><p class="notice">編集内容はこのブラウザのローカル保存領域に記録されます。ブラウザのデータ削除・端末変更・ファイルの開き方によって失われたり別データ扱いになる場合があります。定期的にJSONバックアップを保存してください。</p><div class="actions"><button class="btn primary" onclick="exportJson()">↓ JSONバックアップを保存</button><button class="btn" onclick="document.getElementById('importFile').click()">↑ JSONを読み込む</button></div></div><div class="panel"><h2>探索者の一括登録</h2><p>複数のいあきゃらTXTファイルをまとめて取り込みます。</p><button class="btn" onclick="bulkImportPage()">複数TXTを選んで登録</button></div><div class="panel"><h2>技能区分のカスタマイズ</h2><p>基本区分は維持したまま、技能ごとに表示先を変更できます。</p><button class="btn" onclick="categorySettingsPage()">技能区分を編集する</button></div><div class="panel"><h2>オフラインで使う</h2><p>このHTMLは外部の通信を必要としません。ダウンロードしてブラウザで開けば、ネット接続なしで利用できます。</p><p class="small">端末やブラウザによっては file:// での保存が制限される場合があります。その場合はJSONを書き出してデータを保管してください。</p></div><div class="panel"><h2>データを初期化</h2><button class="btn danger" onclick="resetAll()">探索者データをすべて削除</button></div>`}
function exportJson(){let blob=new Blob([JSON.stringify({format:'jinbutsucho-v1',exportedAt:new Date().toISOString(),characters:chars,skillPreferences:skillPrefs,skillCategoryOverrides:categoryOverrides},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='人物帖_バックアップ_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());let arr=Array.isArray(data)?data:data.characters;if(!Array.isArray(arr)||!arr.every(c=>c&&typeof c==='object'&&typeof c.name==='string'&&typeof c.id==='string'&&c.id.length>0&&(!c.skills||typeof c.skills==='object'&&!Array.isArray(c.skills))))throw Error('人物帖のバックアップ形式ではありません');if(new Set(arr.map(c=>c.id)).size!==arr.length)throw Error('探索者IDが重複しています');if(!confirm(`探索者 ${arr.length} 人のデータで現在のデータを置き換えますか？`))return;let old=chars;chars=arr;if(!save()){chars=old;return}if(data.skillPreferences&&Array.isArray(data.skillPreferences.favorites)&&Array.isArray(data.skillPreferences.order)){skillPrefs=data.skillPreferences;saveSkillPrefs()}if(data.skillCategoryOverrides&&typeof data.skillCategoryOverrides==='object'&&!Array.isArray(data.skillCategoryOverrides)){categoryOverrides=data.skillCategoryOverrides;saveCategoryOverrides()}route('list');alert('読み込みました')}catch(err){alert('読み込みに失敗しました：'+err.message)}finally{e.target.value=''}});
function resetAll(){if(!confirm('この安定版の探索者データをすべて消しますか？'))return;let old=chars;chars=[];if(!save()){chars=old;return}route('list')}
load();render();handleIncomingSummon();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(err=>console.warn("Offline setup failed",err)));}</script></body></html>
