:root{--bg:#f7f5f0;--paper:#fff;--ink:#292725;--muted:#77736e;--line:#e5e0d8;--accent:#98675b;--soft:#f1e8e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4}header{position:sticky;top:0;background:#f7f5f0ee;backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--line)}.wrap{max-width:780px;margin:auto;padding:18px}header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}.logo{font-family:serif;font-size:25px;letter-spacing:.12em}.small{font-size:12px;color:var(--muted)}nav{position:sticky;bottom:0;background:#fffefaf2;border-top:1px solid var(--line);z-index:4;display:flex;justify-content:center;gap:5px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}nav button{background:none;border:0;padding:10px 16px;color:var(--muted);border-radius:10px}nav button.active{background:var(--soft);color:var(--accent);font-weight:700}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:11px 14px;border-radius:10px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.danger{color:#9c3535}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;overflow:hidden;text-align:left;padding:0}.card img{width:100%;height:220px;object-fit:contain;object-position:bottom;background:linear-gradient(140deg,#e8e0d9,#f4f1ec)}.card .info{padding:13px}.card strong{display:block;font-size:17px}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--accent);font-size:11px}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:16px;margin:14px 0}.field{display:block;margin:12px 0}.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input:not([type=file]),textarea,select{width:100%;border:1px solid #d8d1c9;background:white;padding:11px;border-radius:9px;color:var(--ink)}textarea{min-height:88px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hero{background:linear-gradient(140deg,#e9e3de,#f8f6f2);border-radius:18px;min-height:350px;display:flex;justify-content:center;align-items:end;overflow:hidden}.hero img{height:360px;max-width:100%;object-fit:contain;object-position:bottom}.tabs{display:flex;gap:5px;overflow-x:auto;padding:10px 0}.tabs button{flex:1;white-space:nowrap}.bar{height:6px;background:#eee9e3;border-radius:8px;overflow:hidden;margin-top:6px}.bar>div{height:100%;background:var(--accent)}.skillrow{margin:13px 0}.skillrow .line{display:flex;justify-content:space-between;gap:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f8f6f3;text-align:center;padding:11px 3px;border-radius:9px}.stat b{display:block;font-size:21px}.notice{font-size:12px;color:#796b5b;background:#f5eee2;padding:12px;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:35px 15px;text-align:center;color:var(--muted)}.hidden{display:none!important}h1{font-family:serif;font-weight:500;font-size:30px}h2{font-size:19px;font-weight:600}hr{border:0;border-top:1px solid var(--line);margin:20px 0}details{border:1px solid var(--line);padding:12px;border-radius:10px}summary{cursor:pointer}.rank{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.rank .num{width:28px;color:var(--accent);font-weight:700}.rank .who{flex:1}.rank .score{font-size:22px;font-weight:700}.editSkill{display:grid;grid-template-columns:1fr 70px 65px 32px;gap:5px;margin:6px 0;align-items:center}.editSkill input{min-width:0;padding:8px}.editSkill button{border:0;background:#f3eeee;border-radius:7px;height:36px}.muted{color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.card img{height:260px}.hero img{height:440px}.hero{min-height:440px}}@media(max-width:370px){nav button{padding:9px 11px}.editSkill{grid-template-columns:1fr 58px 58px 28px}}

.skill-query{width:100%;box-sizing:border-box;padding:14px;border:1px solid #d9d1c8;border-radius:10px;background:#fff;margin:8px 0 12px;font-size:16px;color:#25272a}

</style><style id="threshold-style">.threshold{padding:12px 0 6px}.threshold-head{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}.threshold-head strong{color:var(--accent);font-size:21px;font-variant-numeric:tabular-nums}.threshold input[type=range]{width:100%;height:30px;accent-color:var(--accent);touch-action:pan-y}.threshold-foot{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;gap:8px}.threshold-foot label{display:flex;align-items:center;gap:5px}.threshold-foot input{width:66px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);text-align:center}.base-check{display:flex;align-items:center;gap:10px;margin:14px 0 7px;padding:10px;background:var(--soft);border-radius:8px;font-size:14px}.base-check input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}</style></head><body><header><div class="wrap"><div><div class="logo">人物帖。</div><div class="small">PRIVATE INVESTIGATOR ARCHIVE</div></div><button class="btn" onclick="newCharacter()">＋ 探索者</button></div></header><main class="wrap" id="app"></main><nav id="nav"><button onclick="route('list')">一覧</button><button onclick="route('search')">技能検索</button><button onclick="editId=null;route('edit')">追加・編集</button><button onclick="route('settings')">保存・設定</button></nav><input type="file" id="importFile" accept=".json,application/json" hidden><script>
const SEED=null; // 個人データ・立ち絵は同梱しない
const KEY='jinbutsucho_stable_v1_characters';
let conditions=[{skill:'目星',min:70,aboveBase:false}],conditionMode='and',jobFilter='',tagFilter='',advancedSort='skill-desc';
let skillPrefs={favorites:['目星','聞き耳','図書館'],order:[]};
try{const saved=JSON.parse(localStorage.getItem('jinbutsucho_stable_v1_skill_prefs')||'null');if(saved&&Array.isArray(saved.favorites)&&Array.isArray(saved.order))skillPrefs=saved}catch(e){}
function saveSkillPrefs(){try{localStorage.setItem('jinbutsucho_stable_v1_skill_prefs',JSON.stringify(skillPrefs))}catch(e){alert('技能の表示設定を保存できませんでした')}}
function orderedSkillNames(){const names=allSkillNames();return names.sort((a,b)=>{const fa=skillPrefs.favorites.includes(a)?0:1,fb=skillPrefs.favorites.includes(b)?0:1;if(fa!==fb)return fa-fb;const ia=skillPrefs.order.indexOf(a),ib=skillPrefs.order.indexOf(b);return (ia<0?99999:ia)-(ib<0?99999:ib)||a.localeCompare(b,'ja')})}
let skillPickerIndex=null,skillPickerQuery='';
const CATEGORY_KEY='jinbutsucho_stable_v1_category_overrides';
const SKILL_CATS=['戦闘技能','探索技能','行動技能','交渉技能','知識技能','その他'];
let categoryOverrides={};
try {categoryOverrides=JSON.parse(localStorage.getItem(CATEGORY_KEY)||'{}')||{}}catch(e){categoryOverrides={}}
function saveCategoryOverrides(){try{localStorage.setItem(CATEGORY_KEY,JSON.stringify(categoryOverrides));return true}catch(e){alert('区分設定を保存できませんでした');return false}}
function setSkillCategory(name,value){
 if(value==='auto')delete categoryOverrides[name];else categoryOverrides[name]=value;
 if(saveCategoryOverrides())categorySettingsPage();
}
function categorySettingsPage(){
 const names=allSkillNames();
 app.innerHTML=`<button class="btn" onclick="route('settings')">← 設定へ</button><h1>技能区分の編集</h1><p class="small">通常はCoC6版の基本区分で表示します。変更した技能だけ、ここで指定した区分を優先します。探索者の技能値は変わりません。</p><div class="panel"><label class="field"><span>技能名で絞り込み</span><input id="categoryFilter" placeholder="例：芸術" autocomplete="off"></label><div id="categoryRows"></div></div>`;
 const input=document.getElementById('categoryFilter');
 input.addEventListener('input',()=>drawCategoryRows(input.value));
 drawCategoryRows('');
}
function drawCategoryRows(query){
 const names=allSkillNames().filter(n=>n.toLocaleLowerCase().includes(query.toLocaleLowerCase()));
 document.getElementById('categoryRows').innerHTML=names.map(name=>`<div style="padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:100px">${esc(name)}</span><select style="width:auto;max-width:180px" data-skill="${esc(name)}"><option value="auto">基本区分に戻す</option>${SKILL_CATS.map(c=>`<option value="${esc(c)}" ${categoryOverrides[name]===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`).join('')||'<p class="muted">該当する技能がありません</p>';
 document.querySelectorAll('#categoryRows select').forEach(el=>el.addEventListener('change',()=>{const name=el.dataset.skill;if(el.value==='auto')delete categoryOverrides[name];else categoryOverrides[name]=el.value;saveCategoryOverrides()}));
}
let showInitialSkills=false; // 個別ページで初期値の技能も表示するか
let chars=[],view='list',selected=null,tab='profile',searchSkill='目星',minValue=0,onlyLearned=false,sortOrder='desc',editId=null;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const s=localStorage.getItem(KEY);if(s){const data=JSON.parse(s);if(Array.isArray(data)){chars=data;return}}}catch(e){alert('保存データを読み込めませんでした。空の状態で起動します。')}chars=[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(chars));return true}catch(e){alert('保存できませんでした。画像容量やブラウザの保存制限をご確認ください。JSONバックアップも利用できます。');return false}}
function route(v){view=v;render();window.scrollTo(0,0)}
function openChar(id){selected=id;tab='profile';showInitialSkills=false;route('detail')}
function activeNav(){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['list','search','edit','settings'][i]===view||(view==='detail'&&i===0)))}
function render(){activeNav();if(view==='list')listPage();else if(view==='detail')detailPage();else if(view==='search')searchPage();else if(view==='edit')editPage();else settingsPage()}
function listPage(){app.innerHTML=`<div class="small">STABLE v1.0 / ${chars.length} RECORDS</div><h1>探索者たちの記録。</h1><label class="field"><span>名前・職業・タグで検索</span><input id="nameFilter" placeholder="例：刑事、比良坂、死傘" oninput="filterCards()"></label><div class="grid" id="cards"></div>`;filterCards()}
function filterCards(){const q=(document.getElementById('nameFilter')?.value||'').toLowerCase();let filtered=chars.filter(c=>[c.name,c.reading,c.job,c.tag,...getTags(c)].join(' ').toLowerCase().includes(q));document.getElementById('cards').innerHTML=filtered.map(c=>`<button class="card" onclick="openChar(${JSON.stringify(c.id).replace(/"/g,'&quot;')})">${c.image?`<img src="${esc(c.image)}" alt="">`:`<div style="height:220px;display:grid;place-items:center;background:#ebe6df;color:#8c8277">NO IMAGE</div>`}<div class="info"><span class="pill">${esc(c.job||'未設定')}</span><strong>${esc(c.name||'無名の探索者')}</strong><div class="small">${esc(c.reading||'')} / ${esc(c.age||'?')}歳</div></div></button>`).join('')||'<div class="empty">該当する探索者はいません。</div>'}
function detailPage(){let c=chars.find(x=>x.id===selected);if(!c){route('list');return}let s=c.stats||{};app.innerHTML=`<button class="btn" onclick="route('list')">← 一覧へ</button><div style="margin-top:15px" class="small">INVESTIGATOR FILE</div><h1 style="margin:6px 0">${esc(c.name)}</h1><div class="small">${esc(c.reading)}　/　${esc(c.job)}</div><div class="hero" style="margin-top:16px">${c.image?`<img src="${esc(c.image)}" alt="${esc(c.name)}の立ち絵">`:'<div class="empty">立ち絵未登録</div>'}</div><div class="tabs">${['profile','status','skills','record'].map((t,i)=>`<button class="btn ${tab===t?'primary':''}" onclick="tab='${t}';detailPage()">${['PROFILE','STATUS','SKILLS','RECORD'][i]}</button>`).join('')}</div><div id="detailContent" class="panel"></div><div class="actions"><button class="btn" onclick="chooseEdit(${JSON.stringify(c.id).replace(/"/g,'&quot;')})">✎ この探索者を編集</button></div>`;
let body='';if(tab==='profile')body=`<div class="two"><div><div class="small">AGE</div><h2>${esc(c.age||'—')} 歳</h2></div><div><div class="small">HEIGHT</div><h2>${esc(c.height||'—')} cm</h2></div></div><p><span class="pill">${esc(c.tag?'#'+c.tag:'タグなし')}</span></p><h2>職業タグ</h2><p>${getTags(c).map(t=>`<span class="pill" style="margin:3px">${esc(t)}</span>`).join('')||'未登録'}</p><h2>人物紹介</h2><p style="white-space:pre-wrap">${esc(c.bio||'紹介文はまだありません。')}</p>`;
if(tab==='status')body=`<div class="stats">${['STR','CON','POW','DEX','APP','SIZ','INT','EDU'].map(k=>`<div class="stat"><div class="small">${k}</div><b>${esc(s[k]??'—')}</b></div>`).join('')}</div><p>HP ${esc(c.hp??'—')}　/　MP ${esc(c.mp??'—')}　/　SAN ${esc(c.san??'—')} / ${esc(c.sanMax??'—')}</p>`;
if(tab==='skills')body=`<label class="initial-skill-toggle" style="display:flex;align-items:center;gap:10px;padding:12px 0;margin-bottom:10px;cursor:pointer"><input type="checkbox" ${showInitialSkills?'checked':''} onchange="showInitialSkills=this.checked;detailPage()" style="width:20px;height:20px;accent-color:var(--accent)"><span>初期値の技能も表示</span></label>`+renderGroupedCharacterSkills(c.skills||{},showInitialSkills);
if(tab==='record')body=`<h2>通過シナリオ</h2>${(c.scenarios||[]).length?`<ul>${c.scenarios.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">記録なし</p>'}<h2>経歴・メモ</h2><p style="white-space:pre-wrap">${esc(c.story||'未登録')}</p><details><summary>ネタバレ・秘匿メモを表示</summary><p style="white-space:pre-wrap">${esc(c.spoiler||'未登録')}</p><p class="notice">これは表示を隠すだけの機能です。パスワードによる暗号化ではありません。</p></details>`;
document.getElementById('detailContent').innerHTML=body}

// 個別ページの技能はキャラシの区分に従ってグループ表示する。
// 未分類や独自技能も削除せず「その他」に表示する。
function renderGroupedCharacterSkills(skills,includeInitial=false){
 const allEntries=Object.entries(skills||{});
 if(!allEntries.length)return '<p class="muted">技能未登録</p>';
 // 初期値が記録されている場合だけ比較する。初期値不明の独自技能は隠さない。
 const entries=includeInitial?allEntries:allEntries.filter(([name,v])=>{
  const value=Number(v&&v.value),base=Number(v&&v.base);
  return v==null||v.base==null||v.base===''||!Number.isFinite(value)||!Number.isFinite(base)||value!==base;
 });
 if(!entries.length)return '<p class="muted">初期値を超える技能はありません。「初期値の技能も表示」にチェックを入れるとすべて確認できます。</p>';
 const standard=['戦闘技能','探索技能','行動技能','交渉技能','知識技能'];
 const normalize=cat=>{
  const t=String(cat||'').trim();
  if(!t)return 'その他';
  const found=standard.find(x=>t===x||t===x.replace('技能','')||t===x.replace('技能','系'));
  return found||t;
 };
 const skillGroups={
  '戦闘技能':['回避','キック','組み付き','こぶし','こぶし（パンチ）','頭突き','投擲','マーシャルアーツ','拳銃','サブマシンガン','ショットガン','マシンガン','ライフル','杖','日本刀','刀','剣','ナイフ','槍','斧','弓','武道'],
  '探索技能':['応急手当','鍵開け','隠す','隠れる','聞き耳','忍び歩き','写真術','精神分析','追跡','登攀','図書館','目星'],
  '行動技能':['運転','機械修理','重機械操作','乗馬','水泳','製作','操縦','跳躍','電気修理','ナビゲート','変装'],
  '交渉技能':['言いくるめ','信用','説得','値切り','母国語','ほかの言語','他の言語','外国語'],
  '知識技能':['医学','オカルト','化学','クトゥルフ神話','芸術','経理','考古学','コンピューター','心理学','人類学','生物学','地質学','電子工学','天文学','博物学','物理学','法律','薬学','歴史']
 };
 function inferCategory(name){
  const n=String(name).replace(/[\s　]/g,'').replace(/[（(].*?[）)]/g,'');
  for(const [cat,items] of Object.entries(skillGroups)){
   if(items.some(x=>n===x||n.startsWith(x+'：')||n.startsWith(x+':')))return cat;
  }
  return 'その他';
 }
 const groups=new Map();
 entries.forEach(([name,v])=>{
  const cat=normalize(v&&v.category)||'その他';
  const resolved=categoryOverrides[name]|| (cat==='その他'?inferCategory(name):cat);
  if(!groups.has(resolved))groups.set(resolved,[]);
  groups.get(resolved).push([name,v||{}]);
 });
 const cats=[...groups.keys()].sort((a,b)=>{
  const ia=standard.indexOf(a),ib=standard.indexOf(b);
  return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b,'ja');
 });
 return cats.map(cat=>`<section class="skill-category"><h3 class="skill-category-title">${esc(cat)} <span class="small">${groups.get(cat).length}件</span></h3>${groups.get(cat).sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([name,v])=>`<div class="skillrow"><div class="line"><span>${esc(name)}</span><b>${esc(v.value??'—')}%</b></div><div class="bar"><div style="width:${Math.max(0,Math.min(100,+v.value||0))}%"></div></div></div>`).join('')}</section>`).join('');
}
function allSkillNames(){return [...new Set(chars.flatMap(c=>Object.keys(c.skills||{})))].sort((a,b)=>a.localeCompare(b,'ja'))}
function allJobTags(){return [...new Set(chars.flatMap(c=>getTags(c)))].sort((a,b)=>a.localeCompare(b,'ja'))}
function getTags(c){return Array.isArray(c.jobTags)?c.jobTags:(typeof c.jobTags==='string'?c.jobTags.split(/[,、\n]/).map(x=>x.trim()).filter(Boolean):[])}
function setCondition(i,key,val){conditions[i][key]=key==='min'?Math.max(0,Math.min(100,Number(val)||0)):key==='aboveBase'?Boolean(val):val;if(key==='min'){const out=document.getElementById('minLabel'+i);if(out)out.textContent=conditions[i].min+'%';const n=document.getElementById('minNumber'+i);if(n&&Number(n.value)!==conditions[i].min)n.value=conditions[i].min;const slider=document.getElementById('minSlider'+i);if(slider&&Number(slider.value)!==conditions[i].min)slider.value=conditions[i].min;}drawResults()}
function addCondition(){conditions.push({skill:orderedSkillNames()[0]||'目星',min:50,aboveBase:false});searchPage()}
function removeCondition(i){if(conditions.length===1)return;conditions.splice(i,1);searchPage()}
function searchPage(){let names=orderedSkillNames();conditions.forEach(c=>{if(!names.includes(c.skill))c.skill=names[0]||''});let jobs=[...new Set(chars.map(c=>c.job).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));let tags=allJobTags();app.innerHTML=`<div class="small">ADVANCED INVESTIGATOR SEARCH</div><h1>探索者・詳細検索</h1><div class="panel"><h2>技能条件</h2><p class="small">「＋条件を追加」でいくつでも増やせます。</p><div id="conditions">${conditions.map((c,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="small">条件 ${i+1}</div><div class="two"><label class="field"><span>技能</span><button type="button" class="btn" style="width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center" onclick="openSkillPicker(${i})"><span>${esc(c.skill||'技能を選択')}</span><span>⌕ ▾</span></button></label></div><div class="threshold"><div class="threshold-head"><label for="minSlider${i}">最低技能値</label><strong id="minLabel${i}">${c.min}%</strong></div><input id="minSlider${i}" aria-label="最低技能値スライダー" type="range" min="0" max="100" step="1" value="${c.min}" oninput="setCondition(${i},'min',this.value)"><div class="threshold-foot"><span>0%</span><label>数値入力 <input id="minNumber${i}" aria-label="最低技能値を数値入力" type="number" min="0" max="100" value="${c.min}" oninput="setCondition(${i},'min',this.value)"></label><span>100%</span></div><label class="base-check"><input type="checkbox" ${c.aboveBase?'checked':''} onchange="setCondition(${i},'aboveBase',this.checked)"><span>初期値より高い探索者のみ</span></label><div class="small">チェック時は、設定した最低値に加えて、その技能の初期値（キャラシの base）を超える探索者を検索します。</div></div>${conditions.length>1?`<button class="btn danger" onclick="removeCondition(${i})">この条件を削除</button>`:''}</div>`).join('')}</div><button class="btn" style="margin-top:12px" onclick="addCondition()">＋ 条件を追加</button><label class="field"><span>条件の組み合わせ</span><select onchange="conditionMode=this.value;drawResults()"><option value="and" ${conditionMode==='and'?'selected':''}>AND：すべて満たす</option><option value="or" ${conditionMode==='or'?'selected':''}>OR：どれかを満たす</option></select></label></div><div class="panel"><h2>職業・タグ</h2><label class="field"><span>職業で絞り込む</span><select onchange="jobFilter=this.value;drawResults()"><option value="">すべての職業</option>${jobs.map(j=>`<option value="${esc(j)}" ${jobFilter===j?'selected':''}>${esc(j)}</option>`).join('')}</select></label><label class="field"><span>職業タグで絞り込む</span><select onchange="tagFilter=this.value;drawResults()"><option value="">すべてのタグ</option>${tags.map(t=>`<option value="${esc(t)}" ${tagFilter===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label><p class="small">タグは探索者の編集画面で自由に追加できます（例：警察関係、医療関係、公務員）。</p><label class="field"><span>並び順</span><select onchange="advancedSort=this.value;drawResults()"><option value="skill-desc" ${advancedSort==='skill-desc'?'selected':''}>条件1の技能が高い順</option><option value="skill-asc" ${advancedSort==='skill-asc'?'selected':''}>条件1の技能が低い順</option><option value="job" ${advancedSort==='job'?'selected':''}>職業順</option><option value="name" ${advancedSort==='name'?'selected':''}>名前順</option></select></label></div><div id="results"></div><div id="skillPickerHost"></div>`;drawResults()}

function openSkillPicker(i){skillPickerIndex=i;skillPickerQuery='';renderSkillPicker()}
function closeSkillPicker(){skillPickerIndex=null;const el=document.getElementById('skillPickerHost');if(el)el.innerHTML=''}
function toggleSkillFavorite(name){const a=skillPrefs.favorites;skillPrefs.favorites=a.includes(name)?a.filter(x=>x!==name):[...a,name];saveSkillPrefs();renderSkillPicker()}
function moveSkill(name,direction){const names=orderedSkillNames();const group=names.filter(n=>skillPrefs.favorites.includes(n)===skillPrefs.favorites.includes(name));let i=group.indexOf(name),j=i+direction;if(j<0||j>=group.length)return;[group[i],group[j]]=[group[j],group[i]];const other=names.filter(n=>skillPrefs.favorites.includes(n)!==skillPrefs.favorites.includes(name));skillPrefs.order=skillPrefs.favorites.includes(name)?[...group,...other]:[...other,...group];saveSkillPrefs();renderSkillPicker()}
function selectPickerSkill(name){if(skillPickerIndex===null)return;conditions[skillPickerIndex].skill=name;closeSkillPicker();searchPage()}
function setSkillPickerQuery(value){skillPickerQuery=value;updateSkillPickerList()}
function updateSkillPickerList(){const list=document.getElementById("skillPickerList");if(!list)return;const filtered=orderedSkillNames().filter(n=>n.toLocaleLowerCase("ja").includes(skillPickerQuery.toLocaleLowerCase("ja")));list.innerHTML=skillPickerRows(filtered)}
function skillPickerRows(filtered){return filtered.map(n=>`<div class="skill-pick-row"><button class="btn ${skillPrefs.favorites.includes(n)?'primary':''}" style="padding:8px" onclick="toggleSkillFavorite(decodeURIComponent('${encodeURIComponent(n)}'))" aria-label="お気に入り切替">${skillPrefs.favorites.includes(n)?'★':'☆'}</button><button class="skill-pick-name" onclick="selectPickerSkill(decodeURIComponent('${encodeURIComponent(n)}'))">${esc(n)}</button><button class="btn" style="padding:8px" onclick="moveSkill(decodeURIComponent('${encodeURIComponent(n)}'),-1)" aria-label="上へ">↑</button><button class="btn" style="padding:8px" onclick="moveSkill(decodeURIComponent('${encodeURIComponent(n)}'),1)" aria-label="下へ">↓</button></div>`).join('')||'<p class="small">該当する技能がありません</p>'}
function renderSkillPicker(keepFocus=false){const host=document.getElementById('skillPickerHost');if(!host||skillPickerIndex===null)return;const all=orderedSkillNames();const filtered=all.filter(n=>n.toLocaleLowerCase('ja').includes(skillPickerQuery.toLocaleLowerCase('ja')));host.innerHTML=`<div class="skill-overlay" onclick="if(event.target===this)closeSkillPicker()"><div class="skill-dialog" role="dialog" aria-modal="true" aria-label="技能を選ぶ"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 style="margin:0">技能を選ぶ</h2><button class="btn" onclick="closeSkillPicker()">閉じる ×</button></div><p class="small">★ お気に入りは先頭へ。↑↓で表示順を変更できます。</p><input id="skillPickerSearch" class="skill-query" placeholder="技能名を入力して検索（例：心理）" value="${esc(skillPickerQuery)}" oninput="setSkillPickerQuery(this.value)"><div id="skillPickerList" class="skill-picker-list">${skillPickerRows(filtered)}</div><p class="small">表示順はこのブラウザに保存されます。検索結果や技能値は変更されません。</p></div></div>`;if(keepFocus){const input=document.getElementById('skillPickerSearch');input?.focus();input?.setSelectionRange(input.value.length,input.value.length)}}

function drawResults(){let arr=chars.filter(c=>{if(jobFilter&&c.job!==jobFilter)return false;if(tagFilter&&!getTags(c).includes(tagFilter))return false;let checks=conditions.map(k=>{const data=c.skills?.[k.skill];if(!data)return false;const val=Number(data.value);if(!Number.isFinite(val)||val<k.min)return false;if(k.aboveBase){const base=Number(data.base);return Number.isFinite(base)&&val>base;}return true;});return conditionMode==='and'?checks.every(Boolean):checks.some(Boolean)});let first=conditions[0]?.skill;arr.sort((a,b)=>advancedSort==='name'?a.name.localeCompare(b.name,'ja'):advancedSort==='job'?(a.job||'').localeCompare(b.job||'','ja')||a.name.localeCompare(b.name,'ja'):(advancedSort==='skill-asc'?1:-1)*((Number(a.skills?.[first]?.value)||0)-(Number(b.skills?.[first]?.value)||0)));document.getElementById('results').innerHTML=`<div class="small">検索結果 ${arr.length} / ${chars.length} 人</div><div class="panel">${arr.map((c,i)=>`<div class="rank" onclick="openChar(${JSON.stringify(c.id).replace(/"/g,'&quot;')})"><div class="num">${i+1}</div><div class="who"><b>${esc(c.name)}</b><div class="small">${esc(c.job||'職業未設定')}　${getTags(c).map(t=>`<span class="pill">${esc(t)}</span>`).join(' ')}</div><div class="small">${conditions.map(k=>`${esc(k.skill)} ${esc(c.skills?.[k.skill]?.value??'—')}%${k.aboveBase?'（初期値超過）':''}`).join(' / ')}</div></div></div>`).join('')||'<div class="empty">条件に一致する探索者はいません。</div>'}</div>`}
function newCharacter(){editId='__new__';route('edit')}
function chooseEdit(id){editId=id;route('edit')}
function editPage(){if(editId===null){app.innerHTML=`<div class="small">CHARACTER MANAGEMENT</div><h1>探索者を選んで編集</h1><p class="small">編集したい探索者をタップしてください。</p><button class="btn primary" onclick="newCharacter()">＋ 新しい探索者を追加</button><div class="panel">${chars.map(c=>`<button class="btn" style="display:flex;align-items:center;width:100%;gap:12px;text-align:left;margin:8px 0" onclick="chooseEdit(${JSON.stringify(c.id).replace(/"/g,'&quot;')})">${c.image?`<img src="${esc(c.image)}" style="width:48px;height:60px;object-fit:contain;background:#eee9e3;border-radius:6px">`:''}<span><b>${esc(c.name)}</b><br><span class="small">${esc(c.job)}</span></span><span style="margin-left:auto">編集 ›</span></button>`).join('')}</div>`;return;}let c=chars.find(x=>x.id===editId);if(!c)c={name:'',reading:'',job:'',age:'',height:'',tag:'',bio:'',story:'',spoiler:'',image:'',stats:{},skills:{},scenarios:[]};app.innerHTML=`<div class="small">CHARACTER EDITOR</div><h1>${editId!=='__new__'?'探索者を編集':'探索者を追加'}</h1><div class="notice">入力後は「保存する」を押してください。画像は大きすぎるとブラウザの保存容量を超える場合があります。</div><form id="editor" onsubmit="submitEdit(event)"><div class="panel"><div class="two"><label class="field"><span>名前</span><input name="name" required value="${esc(c.name)}"></label><label class="field"><span>読み</span><input name="reading" value="${esc(c.reading)}"></label><label class="field"><span>職業</span><input name="job" value="${esc(c.job)}"></label><label class="field"><span>年齢</span><input name="age" value="${esc(c.age)}"></label><label class="field"><span>身長（cm）</span><input name="height" value="${esc(c.height)}"></label><label class="field"><span>作品・シナリオタグ</span><input name="tag" value="${esc(c.tag)}"></label></div><label class="field"><span>職業タグ（カンマ区切りで複数登録）</span><input name="jobTags" placeholder="例：警察関係, 公務員, 捜査職" value="${esc(getTags(c).join(', '))}"></label><p class="small">職業名は「刑事」、職業タグは「警察関係」のように設定できます。</p><label class="field"><span>立ち絵（PNG・JPEGなど）</span><input type="file" id="imagePick" accept="image/*" onchange="previewImage(event)"></label><div id="imagePreview">${c.image?'<span class="small">現在の画像を登録済み</span>':'<span class="small">画像未登録</span>'}</div><label class="field"><span>人物紹介</span><textarea name="bio">${esc(c.bio)}</textarea></label><label class="field"><span>経歴・メモ</span><textarea name="story">${esc(c.story)}</textarea></label><label class="field"><span>秘匿・ネタバレメモ</span><textarea name="spoiler">${esc(c.spoiler)}</textarea></label><label class="field"><span>通過シナリオ（1行に1つ）</span><textarea name="scenarios">${esc((c.scenarios||[]).join('\n'))}</textarea></label></div><div class="panel"><h2>能力値</h2><div class="stats">${['STR','CON','POW','DEX','APP','SIZ','INT','EDU'].map(k=>`<label class="field"><span>${k}</span><input type="number" name="stat_${k}" value="${esc(c.stats?.[k]??'')}"></label>`).join('')}</div><div class="two">${['hp','mp','san','sanMax'].map(k=>`<label class="field"><span>${k.toUpperCase()}</span><input type="number" name="${k}" value="${esc(c[k]??'')}"></label>`).join('')}</div></div><div class="panel"><h2>技能</h2><div class="small">技能名 / 現在値 / 初期値</div><div id="skillEditor">${Object.entries(c.skills||{}).map(([k,v])=>skillInput(k,v.value,v.base)).join('')}</div><button type="button" class="btn" onclick="addSkill()">＋ 技能を追加</button><hr><h2>いあきゃらテキスト取り込み</h2><p class="small">6版テキスト出力を貼ると、能力値と技能を入力欄へ反映します。保存前に内容を確認してください。</p><textarea id="iacharaText" placeholder="いあきゃらテキスト 6版…"></textarea><button type="button" class="btn" onclick="parseIachara()">テキストから反映</button></div><div class="actions"><button class="btn" type="button" onclick="editId=null;route('edit')">← 編集対象一覧へ</button><button class="btn primary" type="submit">変更を保存する</button>${editId!=='__new__'?'<button class="btn danger" type="button" onclick="deleteCharacter()">この探索者を削除</button>':''}</div></form>`;window.pendingImage=c.image||''}
function skillInput(name='',value='',base=''){return `<div class="editSkill"><input class="skName" placeholder="技能名" value="${esc(name)}"><input class="skValue" type="number" min="0" max="999" placeholder="値" value="${esc(value)}"><input class="skBase" type="number" min="0" max="999" placeholder="初期" value="${esc(base)}"><button type="button" onclick="this.parentElement.remove()">×</button></div>`}
function addSkill(){document.getElementById('skillEditor').insertAdjacentHTML('beforeend',skillInput())}
function previewImage(e){let f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024&&!confirm('画像が3MBを超えています。保存できない可能性があります。続けますか？')){e.target.value='';return}let reader=new FileReader();reader.onload=()=>{window.pendingImage=reader.result;document.getElementById('imagePreview').textContent='画像を読み込みました（保存前）'};reader.readAsDataURL(f)}
function submitEdit(e){e.preventDefault();let f=e.target,form=new FormData(f);let old=chars.find(x=>x.id===editId);let c=old?structuredClone(old):{id:'c'+Date.now(),skills:{},stats:{}};for(let k of ['name','reading','job','age','height','tag','bio','story','spoiler'])c[k]=String(form.get(k)||'');c.jobTags=String(form.get('jobTags')||'').split(/[,、\n]/).map(x=>x.trim()).filter(Boolean);c.scenarios=String(form.get('scenarios')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);for(let k of ['STR','CON','POW','DEX','APP','SIZ','INT','EDU']){let v=form.get('stat_'+k);c.stats[k]=v===''?'':Number(v)}for(let k of ['hp','mp','san','sanMax']){let v=form.get(k);c[k]=v===''?'':Number(v)}const priorSkills=c.skills||{};c.skills={};let rows=document.querySelectorAll('.editSkill');rows.forEach(r=>{let name=r.querySelector('.skName').value.trim();if(name){const v=r.querySelector('.skValue').value,b=r.querySelector('.skBase').value;c.skills[name]={...(priorSkills[name]&&typeof priorSkills[name]==='object'?priorSkills[name]:{}),value:v===''?0:Number(v),base:b===''?null:Number(b)}}});c.image=window.pendingImage||'';let previous=structuredClone(chars);if(old)chars[chars.findIndex(x=>x.id===editId)]=c;else chars.push(c);if(!save()){chars=previous;return}selected=c.id;editId=c.id;openChar(c.id)}
function deleteCharacter(){if(!confirm('この探索者を削除しますか？ 削除前にバックアップをおすすめします。'))return;chars=chars.filter(x=>x.id!==editId);if(save()){editId=null;route('list')}}
function parseIachara(){let t=document.getElementById('iacharaText').value;if(!t.trim())return alert('テキストを貼り付けてください');let fields={name:/名前:\s*(.+)/,job:/職業:\s*(.+)/,age:/年齢:\s*([^\/\n]+)/,height:/身長:\s*([^\n]+)/};for(let [k,re] of Object.entries(fields)){let m=t.match(re);if(m){let el=document.querySelector(`[name="${k}"]`);if(el)el.value=m[1].trim()}}let stat=t.match(/【能力値】([\s\S]*?)(?:【技能値】|$)/);if(stat){for(let k of ['STR','CON','POW','DEX','APP','SIZ','INT','EDU','HP','MP']){let m=stat[1].match(new RegExp('^\\s*'+k+'\\s+(\\d+)','m'));let el=document.querySelector(`[name="${['HP','MP'].includes(k)?k.toLowerCase():'stat_'+k}"]`);if(m&&el)el.value=m[1]}}let san=t.match(/正気度\s+(\d+)\s*\/\s*(\d+)/);if(san){document.querySelector('[name=san]').value=san[1];document.querySelector('[name=sanMax]').value=san[2]}let section='';let count=0;let entries=[];for(let line of t.split(/\r?\n/)){let m=line.match(/『(戦闘技能|探索技能|行動技能|交渉技能|知識技能)』/);if(m){section=m[1];continue}if(!section)continue;let hit=line.match(/^\s*(.+?)\s{2,}(\d+)\s+(\d+)\s+\d+\s+\d+\s+\d+\s+\d+\s*$/);if(hit){entries.push(skillInput(hit[1].trim(),hit[2],hit[3]));count++}}if(count)document.getElementById('skillEditor').innerHTML=entries.join('');alert(`取り込みました（技能 ${count} 件）。内容を確認して「変更を保存する」を押してください。`)}
function settingsPage(){app.innerHTML=`<div class="small">LOCAL DATA MANAGEMENT</div><h1>保存とバックアップ</h1><div class="panel"><h2>この端末のデータ</h2><p>登録済み探索者：<b>${chars.length} 人</b></p><p class="notice">編集内容はこのブラウザのローカル保存領域に記録されます。ブラウザのデータ削除・端末変更・ファイルの開き方によって失われたり別データ扱いになる場合があります。定期的にJSONバックアップを保存してください。</p><div class="actions"><button class="btn primary" onclick="exportJson()">↓ JSONバックアップを保存</button><button class="btn" onclick="document.getElementById('importFile').click()">↑ JSONを読み込む</button></div></div><div class="panel"><h2>技能区分のカスタマイズ</h2><p>基本区分は維持したまま、技能ごとに表示先を変更できます。</p><button class="btn" onclick="categorySettingsPage()">技能区分を編集する</button></div><div class="panel"><h2>オフラインで使う</h2><p>このHTMLは外部の通信を必要としません。ダウンロードしてブラウザで開けば、ネット接続なしで利用できます。</p><p class="small">端末やブラウザによっては file:// での保存が制限される場合があります。その場合はJSONを書き出してデータを保管してください。</p></div><div class="panel"><h2>データを初期化</h2><button class="btn danger" onclick="resetAll()">探索者データをすべて削除</button></div>`}
function exportJson(){let blob=new Blob([JSON.stringify({format:'jinbutsucho-v1',exportedAt:new Date().toISOString(),characters:chars,skillPreferences:skillPrefs,skillCategoryOverrides:categoryOverrides},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='人物帖_バックアップ_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());let arr=Array.isArray(data)?data:data.characters;if(!Array.isArray(arr)||!arr.every(c=>c&&typeof c==='object'&&typeof c.name==='string'&&typeof c.id==='string'&&c.id.length>0&&(!c.skills||typeof c.skills==='object'&&!Array.isArray(c.skills))))throw Error('人物帖のバックアップ形式ではありません');if(new Set(arr.map(c=>c.id)).size!==arr.length)throw Error('探索者IDが重複しています');if(!confirm(`探索者 ${arr.length} 人のデータで現在のデータを置き換えますか？`))return;let old=chars;chars=arr;if(!save()){chars=old;return}if(data.skillPreferences&&Array.isArray(data.skillPreferences.favorites)&&Array.isArray(data.skillPreferences.order)){skillPrefs=data.skillPreferences;saveSkillPrefs()}if(data.skillCategoryOverrides&&typeof data.skillCategoryOverrides==='object'&&!Array.isArray(data.skillCategoryOverrides)){categoryOverrides=data.skillCategoryOverrides;saveCategoryOverrides()}route('list');alert('読み込みました')}catch(err){alert('読み込みに失敗しました：'+err.message)}finally{e.target.value=''}});
function resetAll(){if(!confirm('この安定版の探索者データをすべて消しますか？'))return;let old=chars;chars=[];if(!save()){chars=old;return}route('list')}
load();render();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(err=>console.warn("Offline setup failed",err)));}</script></body></html>
